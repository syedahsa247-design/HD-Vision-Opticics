<style>
#chatB,#chat{display:none!important}
.hv{max-width:980px;margin:48px auto 24px;padding:0 16px}
.hv-box{background:#fff;color:#14213d;border-radius:24px;padding:26px;box-shadow:0 10px 30px #0003}
.hv-box h2{font-size:1.8rem;margin:0 0 6px;color:#0b2545}
.hv-box .s{color:#5a6b85;margin:0 0 18px}
.hv-g{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.hv-g{grid-template-columns:1fr 1fr}}
.hv-c{border:1px solid #e6dfce;border-radius:16px;overflow:hidden}
.hv-c .h{padding:11px 14px;color:#fff;font-weight:800}
.hv-c .b{padding:12px 14px;display:grid;gap:2px}
.hv-c small{color:#5a6b85;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.hv-c b{font-size:1.08rem;color:#0b2545}
.hv-c button{margin-top:10px;background:#faf7f0;border:1px solid #e6dfce;color:#0b2545;padding:9px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.hv-n{background:#fff7e0;border:1px solid #d4af5a;border-radius:12px;padding:12px 14px;margin:14px 0;font-size:.9rem}
.hv-b{display:inline-block;padding:12px 22px;border-radius:99px;background:#1faa59;color:#fff;text-decoration:none;border:0;cursor:pointer;font:inherit;font-weight:600}
#hvBtn{position:fixed;right:16px;bottom:16px;width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;background:#0b7f7a;display:grid;place-items:center;z-index:9999;box-shadow:0 8px 22px #0006}
#hvBtn svg{width:28px;height:28px;fill:#fff}
#hvBox{position:fixed;right:12px;bottom:84px;width:min(360px,calc(100vw - 24px));height:min(480px,72vh);background:#fff;color:#14213d;border:1px solid #e6dfce;border-radius:20px;z-index:10000;display:none;flex-direction:column;overflow:hidden;box-shadow:0 14px 40px #0006;font-family:inherit}
#hvBox.open{display:flex}
#hvBox .ch{background:linear-gradient(90deg,#0b2545,#0b7f7a);color:#fff;padding:12px 16px;font-weight:700;display:flex;justify-content:space-between}
#hvBox .ch small{display:block;font-weight:400}
#hvBox .ch button{background:none;border:0;color:#fff;font-size:1.3rem;cursor:pointer}
#hvMsgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#faf7f0}
.hv-m{max-width:88%;padding:9px 13px;border-radius:14px;font-size:.9rem;white-space:pre-line}
.hv-m.b{background:#fff;border:1px solid #e6dfce;align-self:flex-start}
.hv-m.u{background:#0b2545;color:#fff;align-self:flex-end}
.hv-m a{color:#0b7f7a;font-weight:600}
#hvQ{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px}
#hvQ button{background:#fff;border:1px solid #0b7f7a;color:#0b7f7a;padding:5px 11px;border-radius:99px;font:inherit;font-size:.78rem;cursor:pointer}
#hvF{display:flex;gap:8px;padding:10px;border-top:1px solid #e6dfce}
#hvF input{flex:1;font:inherit;border:1px solid #e6dfce;border-radius:12px;padding:9px 12px;color:#14213d;background:#fff}
#hvF button{background:#0b2545;color:#fff;border:0;border-radius:12px;padding:0 16px;font-weight:700;cursor:pointer}
</style>

<script>
(function(){
var NAME="Syed Bilal Hussian",NO="03224377278";
var PAYS=[["Easypaisa","#2e9e4f"],["JazzCash","#d71920"],["SadaPay","#0e9f8a"],["NayaPay","#5b2bd6"]];
function G(n,d){return typeof window[n]!=="undefined"?window[n]:d}
var BRAND=G("BRAND","HD Vision Opticics"),PHONE=G("PHONE","923224377278"),SHOWN=G("SHOWN","0322-4377278"),
TIMING=G("TIMING","Rozana subah 8 AM se raat 10 PM tak"),OWNER=G("OWNER","Syed Bilal"),MENU=G("MENU",[]);
function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e}
function w(t){return "https://wa.me/"+PHONE+"?text="+encodeURIComponent(t)}
function fmt(n){return n.replace(/^(\d{4})(\d+)$/,"$1-$2")}

/* ===== PAYMENT SECTION ===== */
var sec=mk("section","hv");sec.id="hv-pay";
var box=mk("div","hv-box");
box.appendChild(mk("h2","","Payment"));
box.appendChild(mk("p","s","Neeche diye gaye kisi bhi account mein payment bhej sakte hain."));
var g=mk("div","hv-g");
PAYS.forEach(function(p){
  var c=mk("div","hv-c"),h=mk("div","h",p[0]);h.style.background=p[1];
  var b=mk("div","b");
  b.appendChild(mk("small","","Account title"));b.appendChild(mk("b","",NAME));
  b.appendChild(mk("small","","Account number"));b.appendChild(mk("b","",fmt(NO)));
  var cp=mk("button","","Number copy karein");cp.type="button";
  cp.onclick=function(){
    function ok(){cp.textContent="Copy ho gaya ✓";setTimeout(function(){cp.textContent="Number copy karein"},2000)}
    try{navigator.clipboard.writeText(NO).then(ok,function(){cp.textContent=NO})}catch(e){cp.textContent=NO}};
  b.appendChild(cp);c.appendChild(h);c.appendChild(b);g.appendChild(c)});
box.appendChild(g);
box.appendChild(mk("div","hv-n","Zaroori: Payment bhejne se pehle WhatsApp par order confirm karwa lein. Account ka naam "+NAME+" hi hona chahiye. Payment ke baad screenshot WhatsApp par bhej dein."));
var a=mk("a","hv-b","Payment ka screenshot bhejein");
a.href=w("Assalam o Alaikum, maine payment bhej di hai.\nNaam:\nItem:\nPayment method:\n(Screenshot isi chat mein bhej raha/rahi hoon)");
a.target="_blank";a.rel="noopener";box.appendChild(a);
sec.appendChild(box);
var ft=document.querySelector("footer");
if(ft)ft.parentNode.insertBefore(sec,ft);else document.body.appendChild(sec);

/* side menu mein Payment ka link (agar side menu hai) */
var dr=document.getElementById("drawer");
if(dr){var ls=dr.querySelectorAll("a.l"),last=ls[ls.length-1];
  var l=mk("a","l","Payment");l.href="#hv-pay";
  l.addEventListener("click",function(){dr.classList.remove("open");var o=document.getElementById("ov");if(o)o.classList.remove("open")});
  if(last)last.parentNode.insertBefore(l,last.nextSibling)}

/* ===== ASSISTANT ===== */
var btn=mk("button","","");btn.id="hvBtn";btn.setAttribute("aria-label","Assistant");
btn.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>';
var bx=mk("div","");bx.id="hvBx";bx.id="hvBox";
bx.innerHTML='<div class="ch"><div>HD Vision Assistant<small>24/7 · turant jawab</small></div><button id="hvX" aria-label="Band karein">×</button></div><div id="hvMsgs"></div><div id="hvQ"></div><form id="hvF"><input id="hvI" placeholder="Apna sawal likhein..." autocomplete="off"><button>Bhejein</button></form>';
document.body.appendChild(btn);document.body.appendChild(bx);
var msgs=document.getElementById("hvMsgs");
btn.onclick=function(){bx.classList.toggle("open")};
document.getElementById("hvX").onclick=function(){bx.classList.remove("open")};
window.openChat=function(){bx.classList.add("open")};
function say(t,who,link){var m=mk("div","hv-m "+who,t);
  if(link){m.appendChild(document.createElement("br"));var k=mk("a","","WhatsApp par baat karein");k.href=w("Assalam o Alaikum, "+BRAND+". Mujhe order/inquiry karni hai.");k.target="_blank";k.rel="noopener";m.appendChild(k)}
  msgs.appendChild(m);msgs.scrollTop=1e5}
function has(q,ws){return ws.some(function(x){return q.indexOf(x)>-1})}
function price(m){return m.p?"Rs. "+m.p:"WhatsApp par pooch lein"}
function find(q){return MENU.filter(function(m){
  var ws=m.n.toLowerCase().split(/[^a-z]+/).filter(function(x){return x.length>3&&["lenses","frames","with"].indexOf(x)<0});
  return ws.some(function(x){return q.indexOf(x)>-1})})}
var cats=[];MENU.forEach(function(m){if(cats.indexOf(m.c)<0)cats.push(m.c)});
function reply(q){
  if(has(q,["payment","pay ","easypaisa","jazzcash","jazz","sadapay","nayapay","naya pay","sada pay","account"]))
    return {t:"Payment ke tareeqe: "+PAYS.map(function(p){return p[0]}).join(", ")+".\nAccount title: "+NAME+"\nNumber: "+fmt(NO)+"\nPehle WhatsApp par order confirm karein, phir payment ka screenshot bhej dein.",l:1};
  var f=find(q);
  if(f.length)return {t:f.slice(0,2).map(function(m){return m.n+" ("+m.c+")\n"+m.d.join(", ")+"\nPrice: "+price(m)}).join("\n\n")+"\n\nOrder ke liye menu mein “Order” dabayein."};
  if(has(q,["menu","products","kya kya","items","list"]))return {t:cats.length?"Hamare paas: "+cats.join(", ")+". Menu section mein har cheez ki detail aur price hai.":"Menu section mein saari cheezein dekh lein."};
  if(has(q,["timing","waqt","time","khul","band","open"]))return {t:"Dukaan ka waqt: "+TIMING};
  if(has(q,["address","kahan","location","rasta","map","jagah"]))return {t:"Hum Taj Bagh, Lahore mein hain. Neeche Map section mein rasta hai."};
  if(has(q,["test","nazar","eye","check","power","nambar"]))return {t:"Computerized eye test dukaan par hota hai. Aa kar apna test karwa lein."};
  if(has(q,["price","rate","qeemat","kitne","paise","cost"]))return {t:"Menu mein har cheez ka rate likha hai. Khaas frame ya lens ka rate WhatsApp par pooch lein.",l:1};
  if(has(q,["order","chashma","buy","khareed","glasses"]))return {t:"Menu mein se item chunein aur “Order” dabayein, ya WhatsApp par likh dein."};
  if(has(q,["job","career","naukri","cv","apply"]))return {t:"Careers section mein form bhar kar apply karein, phir CV WhatsApp par bhej dein."};
  if(has(q,["number","phone","call","owner","bilal"]))return {t:"Owner: "+OWNER+"\nPhone/WhatsApp: "+SHOWN};
  if(has(q,["salam","hello","assalam"]))return {t:"Walaikum Assalam! Main aap ki kya madad kar sakta hoon?"};
  if(has(q,["shukriya","thanks","thank"]))return {t:"Aap ka shukriya! Koi aur sawal ho to poochein."};
  return {t:"Is sawal ka jawab owner dein ge. Barah-e-karam WhatsApp par likhein.",l:1}}
function ask(t){say(t,"u");var r=reply(t.toLowerCase()+" ");setTimeout(function(){say(r.t,"b",r.l)},400)}
say("Assalam o Alaikum! Main "+BRAND+" ka assistant hoon. Dukaan, products, rates aur payment ke baare mein poochein.","b");
["Menu","Timing","Address","Rate","Payment","Job"].forEach(function(t){
  var b=mk("button","",t);b.type="button";b.onclick=function(){ask(t)};document.getElementById("hvQ").appendChild(b)});
document.getElementById("hvF").onsubmit=function(e){e.preventDefault();var i=document.getElementById("hvI"),v=i.value.trim();if(v){ask(v);i.value=""}};
})();
            </script>
